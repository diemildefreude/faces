services:
  web:
    build: .
    container_name: faces-web-1
    command: bash -c "chown -R www-data:www-data /var/www/html/dist/img /var/www/html/dist/audio /var/www/html/justImg /var/www/html/dist/justImg && apache2-foreground"
    volumes:
      - ./dist/img:/var/www/html/dist/img
      - ./dist/audio:/var/www/html/dist/audio
      - ./justImg:/var/www/html/justImg
      - ./dist/justImg:/var/www/html/dist/justImg
    environment:
      - DB_HOST=sep-common-db-1
      - DB_USER=root
      - DB_PASS=${SHARED_DB_PASSWORD}
      - DB_NAME=${DB_NAME:-faces_db}
      - DB_PORT=3306
    networks:
      - npm_default
      - sep_common_net

networks:
  npm_default:
    external: true
  sep_common_net:
    external: true
